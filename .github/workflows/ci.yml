name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Rapid pushes to the same PR cancel the outdated run instead of stacking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm/action-setup installs pnpm WITHOUT running it, so it works
      # even before Node is configured (runs on the action's own Node).
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The eight gates (lint → typecheck → test → check-config → build →
      # check-content → check-links → check-i18n) live in one composite
      # action so the auto-content pipeline verifies drafts with the exact
      # same definition before opening a PR.
      - name: Quality gates
        uses: ./.github/actions/gates
        with:
          # Empty = astro.config.ts falls back to https://<site.domain> (src/config/site.ts).
          site-url: ${{ vars.SITE_URL }}
